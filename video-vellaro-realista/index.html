<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --papel: #121110;
        --grafite: #cfcbc4;
        --latao: #c9a36a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--papel);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #papel {
        position: absolute;
        inset: 0;
        background: var(--papel);
      }
      #papel-fibra {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        opacity: 0.035;
      }
      #papel-vinheta {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse 78% 62% at 50% 46%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.12) 100%);
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-dluy" id="root" data-composition-id="main" data-start="0" data-duration="31" data-width="1080" data-height="1920">
      <!-- a mesa em 3D: papel, régua de aço, lapiseira e luz -->
      <div data-hf-id="hf-xxdn"
        id="mesa"
        class="clip"
        data-composition-id="mesa"
        data-composition-src="compositions/mesa.html"
        data-start="0"

        data-track-kind="graphics"

      ></div>
      <div data-hf-id="hf-w4zo"

        data-composition-src="compositions/textos.html"
        data-start="0"
        data-duration="23"
        data-track-index="2"
        data-track-kind="captions"
        style="z-index: 3"
      ></div>

      <div data-hf-id="hf-yayn" id="papel-vinheta"></div>

      <!-- narração (voz aveludada) -->
      <audio data-hf-id="hf-h0ta" id="voz-traco" class="clip" src="assets/audio/v1-traco.mp3" data-start="0.4" data-duration="2.56" data-track-index="3" data-volume="1"></audio>
      <audio data-hf-id="hf-9dak" id="voz-medida" class="clip" src="assets/audio/v2-medida.mp3" data-start="8.4" data-duration="3.32" data-track-index="3" data-volume="1"></audio>
