<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: var(--font-display, "Nunito"), sans-serif;
    }
    /* o bico da impressora: a linha laranja que "imprime" a montagem de baixo para cima */
    #legendas-bico {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 90px;
    }
    #legendas-bico .filete {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 8px;
      background: var(--color-accent, #e78d33);
      box-shadow: 0 0 22px 6px rgba(231, 141, 51, 0.75);
    }
    #legendas-bico .camadas {
      position: absolute;
      left: 0;
      top: 8px;
      width: 1080px;
      height: 82px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(231, 141, 51, 0.38) 0px,
        rgba(231, 141, 51, 0.38) 3px,
        rgba(231, 141, 51, 0) 3px,
        rgba(231, 141, 51, 0) 9px
      );
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0%, transparent 100%);
    }
    .etiqueta {
      position: absolute;
      left: 72px;
      top: 236px;
      width: 936px;
    }
    .etiqueta .placa {
      display: inline-block;
      position: relative;
      padding: 18px 36px 24px 52px;
      border-radius: 20px;
      background: var(--color-ground, #1a2530);
      color: var(--color-ink, #f7f3ec);
      font-weight: 900;
      font-size: 80px;
      line-height: 1;
      letter-spacing: -0.015em;
    }
    .etiqueta .placa::before {
      content: "";
      position: absolute;
      left: 18px;
      top: 22px;
      bottom: 24px;
      width: 12px;
      border-radius: 6px;
      background: var(--color-accent, #e78d33);
    }
    .etiqueta .placa span {
      display: inline-block;
    }
    .etiqueta .acento {
      color: var(--color-accent, #e78d33);
    }
  </style>
  <div
    id="root"
    data-composition-id="legendas"
    data-width="1080"
    data-height="1920"
  >
    <div id="legendas-bico" class="clip" data-start="0" data-duration="0.7" data-layout-allow-overflow>
      <div class="filete"></div>
      <div class="camadas"></div>
    </div>

    <div id="legenda-1" class="etiqueta clip" data-start="0.5" data-duration="1.75">
      <div class="placa"><span>Peça</span> <span>por</span> <span class="acento">peça.</span></div>
    </div>
    <div id="legenda-2" class="etiqueta clip" data-start="2.6" data-duration="2.05">
      <div class="placa"><span>Encaixe</span> <span>a</span> <span class="acento">encaixe.</span></div>
    </div>
    <div id="legenda-3" class="etiqueta clip" data-start="7" data-duration="2.05">
      <div class="placa"><span>Cada</span> <span>detalhe</span> <span class="acento">conta.</span></div>
    </div>
    <div id="legenda-4" class="etiqueta clip" data-start="15" data-duration="1.75">
      <div class="placa"><span>Pronto</span> <span>pra</span> <span class="acento">zarpar.</span></div>
    </div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // o bico sobe junto com a revelação da montagem (mesma duração e curva do clip-path no index)
      tl.fromTo("#legendas-bico", { y: 1912 }, { y: -8, duration: 0.6, ease: "power2.inOut" }, 0);
      tl.to("#legendas-bico", { opacity: 0, duration: 0.08, ease: "none" }, 0.58);

      // cada etiqueta é "extrudada" da esquerda para a direita, como um filete, e as palavras acendem
      const ETIQUETAS = [
        ["#legenda-1", 0.5, 2.05],
        ["#legenda-2", 2.6, 4.45],
        ["#legenda-3", 7.0, 8.85],
        ["#legenda-4", 15.0, 16.55],
      ];
      for (const [sel, ent, sai] of ETIQUETAS) {
        const placa = sel + " .placa";
        const palavras = gsap.utils.toArray(sel + " .placa span");
        tl.fromTo(placa, { clipPath: "inset(0% 100% 0% 0% round 20px)" }, { clipPath: "inset(0% 0% 0% 0% round 20px)", duration: 0.32, ease: "expo.out" }, ent);
        tl.fromTo(palavras, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out", stagger: 0.07 }, ent + 0.08);
        tl.to(placa, { clipPath: "inset(0% 0% 0% 100% round 20px)", duration: 0.18, ease: "power3.in" }, sai);
      }

      tl.set({}, {}, 18);
      window.__timelines["legendas"] = tl;
    })();
  </script>
</template>
