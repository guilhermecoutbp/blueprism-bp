      const tl = gsap.timeline({ paused: true });

      // abertura: a câmera chega na peça pronta e assenta, abrindo espaço para o título no alto
      tl.fromTo(
        "#lente-a",
        { scale: 1.37, x: 128, y: 322, transformOrigin: "50% 50%" },
        { scale: 1.32, x: 130, y: 300, duration: 1.1, ease: "expo.out" },
        0
      );

      // a montagem entra "impressa": revelada de baixo para cima, no ritmo do bico
      tl.set("#cam-b", { clipPath: "inset(100% 0% 0% 0%)" }, 0);
      tl.to("#cam-b", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.inOut" }, 2.4);

      // enquadramentos da montagem: punch-ins secos na batida
      const QUADROS = [
        [2.4, 1, 0, 0],
        [4.8, 1, 0, 0],
        [6.0, 1.14, 0, -40],
        [7.2, 1.06, 0, 0],
        [9.2, 1, 0, 0],
        [10.4, 1.12, 0, 60],
        [11.6, 1, 0, 0],
        [13.2, 1.08, 0, 0],
        [15.6, 1, 0, 0],
        [17.2, 1, 0, 0],
        [18.8, 1.1, 0, 40],
        [20.4, 1, 0, 0],
      ];
      for (const [t, s, x, y] of QUADROS) {
        tl.set("#lente-b", { scale: s, x, y, transformOrigin: "50% 50%" }, t);
      }

      tl.set({}, {}, 28.8);
      window.__timelines["main"] = tl;
    </script>
