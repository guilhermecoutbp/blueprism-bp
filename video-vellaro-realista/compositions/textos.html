  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      // cada palavra entra quando é dita: a fala é dividida pelo número de letras
      // [frase, trechos de fala [início, fim, nº de palavras], saída]
      const FRASES = [
        ["#textos-f1", [[0.43, 2.51, 6]], 5.9],
        ["#textos-f2", [[8.43, 9.36, 2], [9.45, 10.92, 5]], 12.4],

        ["#textos-f4", [[17.93, 18.51, 1], [18.62, 19.02, 2], [19.1, 19.77, 1], [19.91, 21.77, 5]], 21.85],
      ];
      for (const [sel, trechos, saida] of FRASES) {
        const palavras = gsap.utils.toArray(sel + " span");
        let n = 0;
        for (const [ini, fim, qtd] of trechos) {
          const grupo = palavras.slice(n, n + qtd);
          n += qtd;
          const pesos = grupo.map((p) => p.textContent.replace(/[^\p{L}]/gu, "").length + 1);
          const total = pesos.reduce((a, b) => a + b, 0);
          let acc = 0;
          grupo.forEach((p, i) => {
            const t = ini + ((fim - ini) * acc) / total - 0.06;
            acc += pesos[i];
            tl.fromTo(p, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, t);
          });
        }
        tl.to(palavras, { opacity: 0, filter: "blur(8px)", duration: 0.25, ease: "power3.in" }, saida);
      }
      tl.set({}, {}, 23);
      window.__timelines["textos"] = tl;
