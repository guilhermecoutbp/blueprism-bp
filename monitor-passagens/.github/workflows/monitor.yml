name: Monitor de passagens

on:
  schedule:
    - cron: "7 * * * *"   # de hora em hora (o minuto 7 evita o pico da hora cheia)
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

# Nunca duas execuções ao mesmo tempo: a segunda espera a primeira terminar.
concurrency:
  group: monitor-passagens
  cancel-in-progress: false

jobs:
  monitorar:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[Passagem]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar preços
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python -m monitor

      - name: Salvar histórico
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/historico.json)" ]; then
            echo "Histórico sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico.json
          git commit -m "Atualiza histórico de preços [skip ci]"
          for tentativa in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          echo "Não foi possível enviar o histórico." && exit 1
