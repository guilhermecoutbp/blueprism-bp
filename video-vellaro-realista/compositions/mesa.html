        baixoDir: [740, B - E, R - 740, E], esqBaixo: [L, 764, E, B - 764], esqCima: [L, T, E, 520 - T],
        divisoria: [560, T + E, E, 560 - T - E],

      const hachuras = [];
      const hach = (r) => { const h = { r, a: 0 }; hachuras.push(h); return h; };
      const HH = {};
      for (const k in H) HH[k] = hach(H[k]);

      const g1 = [
        linha(L, T, R, T, { regua: true }),
        linha(L + E, T + E, R - E, T + E, { regua: true, depois: [HH.topo] }),
        linha(R, T, R, B, { regua: true }),
        linha(R - E, T + E, R - E, B - E, { regua: true, depois: [HH.direita] }),

        linha(R - E, B - E, 740, B - E, { regua: true, depois: [HH.baixoDir] }),

        linha(L + E, 520, L + E, T + E, { regua: true, depois: [HH.esqCima] }),
        linha(560, T + E, 560, 560, { regua: true }),
        linha(578, T + E, 578, 560, { regua: true, depois: [HH.divisoria] }),
        linha(560, 560, 578, 560, { sobra: 3, w: 2 }),
        linha(640, B - E, 640, B, { sobra: 3, w: 2 }),
        linha(740, B - E, 740, B, { sobra: 3, w: 2 }),

      // cotas

      const g2 = [
        cota(L, 250, R, 250, 6.4, 540, 232, 0, [[L, 286, L, 236], [R, 286, R, 236]]),
        cota(980, T, 980, B, 6.7, 1006, 710, -90, [[944, T, 994, T], [944, B, 994, B]]),

      // marcenaria
      const fundos = [[578, 318, 334, 60], [628, 470, 244, 90], [168, 800, 38, 260]].map((r) => ({ r, a: 0 }));
      const leds = [];
      function led(x1, y1, x2, y2) {

      }
      const portas = [634, 690, 746, 802, 858].map((x) => [x, 318, x, 378]);
      const ripas = [];
      for (let y = 812; y < 1052; y += 16) ripas.push([168, y, 206, y]);
      const g3 = [
        linha(578, 378, 912, 378, { sobra: 6, w: 1.8, camada: "moveis" }),
        linha(578, 371, 912, 371, { sobra: 0, w: 1, op: 0.6, camada: "moveis" }),
        traçoDe(portas, { w: 1, op: 0.7, camada: "moveis" }),
        led(592, 388, 898, 388),
        retangulo(628, 470, 872, 560, { camada: "moveis" }),
        linha(640, 482, 860, 482, { sobra: 0, w: 1, op: 0.55, camada: "moveis" }),
        led(642, 570, 858, 570),
        retangulo(168, 800, 206, 1060, { camada: "moveis" }),
        traçoDe(ripas, { w: 0.9, op: 0.6, camada: "moveis" }),
        led(216, 812, 216, 1048),
        // estar: tapete, sofá voltado para o painel e mesa de centro

        traçoDe([[476, 806, 476, 1054], [400, 830, 476, 830], [400, 1030, 476, 1030]], { w: 1, op: 0.7, camada: "moveis" }),
        arco(318, 930, 44, -Math.PI / 2, Math.PI * 1.5, { w: 1.4, camada: "moveis" }),
      ];
      const contornos = [g3[0], g3[4], g3[7]];

      // a última linha: o lápis deixa a planta e vai ao papel em branco, onde nasce o logo
      const YL = 2100; // altura da linha do logo no papel
      const g4 = [linha(300, YL, 780, YL, { sobra: 0, cor: LATAO, w: 3, camada: "final" })];
      g4[0].led = true;
      const ABRE = 25.4, ABRE_DUR = 0.7;

      /* ---------- agenda ---------- */
      function agendar(lista, inicio, fim, vel, viagem = 0.24) {
        const base = lista.map((s) => Math.max(0.16, s.len / vel));
        const soma = base.reduce((a, b) => a + b, 0);
        const k = Math.max(0.35, (fim - inicio - viagem * (lista.length - 1)) / soma);
        let t = inicio;
        lista.forEach((s, i) => { s.ini = t; s.dur = base[i] * k; t += s.dur + viagem; });
      }
      agendar(g1, -0.55, 7.5, 1500);
      agendar(g2, 8.1, 12.2, 1200);
      agendar(g3, 12.9, 16.3, 900, 0.14);
      agendar(g4, 23.0, 24.0, 500);
      const todos = [...g1, ...g2, ...g3, ...g4];
      window.__mesaAgenda = todos.map((s) => ({ ini: s.ini, dur: s.dur, len: s.len, regua: s.regua }));
      const primeiro = (s) => [s.segs[0][0], s.segs[0][1]];
      const ultimo = (s) => { const g = s.segs[s.segs.length - 1]; return [g[2], g[3]]; };

      function pontoNo(s, k) {
        let alvo = s.len * k;
        for (const g of s.segs) {
          const l = segLen(g);
          if (alvo <= l) { const q = l ? alvo / l : 1; return [lerp(g[0], g[2], q), lerp(g[1], g[3], q)]; }
          alvo -= l;
        }
        return ultimo(s);
      }
      function pontaEm(t) {
        let tip = primeiro(todos[0]), lift = 0, ativo = null, prox = todos[0], ant = null;
        for (let i = 0; i < todos.length; i++) {
          const s = todos[i];
          if (t >= s.ini && t <= s.ini + s.dur) { ativo = s; break; }
          if (t < s.ini) { prox = s; ant = todos[i - 1] || null; break; }
          ant = s; prox = null;
        }
        if (ativo) tip = pontoNo(ativo, traco(clamp01((t - ativo.ini) / ativo.dur)));
        else if (ant && prox && ant === g3[g3.length - 1]) {
          // a planta vira maquete: o lápis sai de cena e só volta para a última linha
          const a = ultimo(ant), b = primeiro(prox);
          const sai = inOut(clamp01((t - (ant.ini + ant.dur) - 0.1) / 0.9));
          const volta = inOut(clamp01((t - (prox.ini - 1.0)) / 0.95));
          if (volta <= 0) { tip = [lerp(a[0], 1750, sai), lerp(a[1], 650, sai)]; lift = 2.2 * clamp01(sai * 3); }
          else { tip = [lerp(1650, b[0], volta), lerp(YL - 160, b[1], volta)]; lift = 2.2 * (1 - clamp01((volta - 0.7) / 0.3)); }
        } else if (ant && prox) {
          const a = ultimo(ant), b = primeiro(prox);
          const janela = prox.ini - (ant.ini + ant.dur);
          const u = clamp01((t - (ant.ini + ant.dur)) / janela);
          const k = inOut(u);
          tip = [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
          const longe = Math.hypot(b[0] - a[0], b[1] - a[1]) > 30 || janela > 0.4;
          lift = longe ? Math.sin(Math.PI * u) * (janela > 1 ? 2.2 : 1) : 0;
        } else if (ant && !prox) {
          const a = ultimo(ant);
          const u = inOut(clamp01((t - (ant.ini + ant.dur) - 0.2) / 0.9));
          tip = [lerp(a[0], 1600, u), lerp(a[1], YL + 300, u)];
          lift = clamp01(u * 3) * 2;
        }
        return { tip, lift };
      }

      // régua: o meio dela fica no meio do traço
      function poseRegua(s) {
        const a = primeiro(s), b = ultimo(s);
        const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
        const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        return { x: mx - Math.cos(ang) * 430, y: my - Math.sin(ang) * 430, ang };
      }
      const comRegua = todos.filter((s) => s.regua);
      function poseReguaEm(t) {
        let pose = poseRegua(comRegua[0]);
        for (let i = 0; i < comRegua.length; i++) {
          const s = comRegua[i];
          const chegada = s.ini - 0.04;
          const saida = i > 0 ? comRegua[i - 1].ini + comRegua[i - 1].dur : -9;
          if (t < saida) break;
          if (t >= chegada) { pose = poseRegua(s); continue; }
          const a = i > 0 ? poseRegua(comRegua[i - 1]) : poseRegua(s);
          const b = poseRegua(s);
          let da = b.ang - a.ang;
          while (da > Math.PI) da -= 2 * Math.PI;
          while (da < -Math.PI) da += 2 * Math.PI;
          const k = inOut(clamp01((t - saida) / Math.max(0.05, chegada - saida)));
          pose = { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), ang: a.ang + da * k };
          break;
        }
        const ultima = comRegua[comRegua.length - 1];
        const sai = inOut(clamp01((t - (ultima.ini + ultima.dur) - 0.3) / 0.9));
        if (sai > 0) pose = { x: lerp(pose.x, 1700, sai), y: lerp(pose.y, 900, sai), ang: pose.ang };
        return pose;
      }

      // câmera: foco (fx, fy) do papel vai para (540, 760) da tela; inclinação em graus
      const CAM = [
        { t: -1, s: 1.1, fx: 540, fy: 815, inc: 17, az: 0, ty: 0 },
        { t: 0.6, s: 1.1, fx: 540, fy: 815, inc: 17, az: 0, ty: 0 },
        { t: 7.2, s: 0.94, fx: 560, fy: 745, inc: 13, az: 0, ty: 0 },
        { t: 16.3, s: 0.94, fx: 560, fy: 745, inc: 13, az: 0, ty: 0 },
        { t: 18.0, s: 0.9, fx: 545, fy: 700, inc: 47, az: -16, ty: 60 },
        { t: 21.5, s: 0.9, fx: 545, fy: 700, inc: 50, az: 16, ty: 60 },
        { t: 23.7, s: 1, fx: 540, fy: YL - 60, inc: 3, az: 0, ty: 0 },
        { t: 99, s: 1, fx: 540, fy: YL - 60, inc: 3, az: 0, ty: 0 },

      function camera(t) {

      /* ---------- a folha: o desenho é pintado numa textura ---------- */
      const X0 = -60, Y0 = 140, W = 1200, HH_ = 2300, S = 1.25;
      const folha = document.createElement("canvas");

      const luz = document.createElement("canvas"); // só o latão que emite luz

      const fc = folha.getContext("2d");
      const lc = luz.getContext("2d");

      // medidas das letras do logo (para traçá-las)
      const NS = "http://www.w3.org/2000/svg";

      const letras = LOGO.name.map(([tx, ty, d]) => {
        const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); medidor.appendChild(p);
        return { tx, ty, p2: new Path2D(d), len: p.getTotalLength() };
      });
      const subs = LOGO.sub.map(([tx, ty, d]) => ({ tx, ty, p2: new Path2D(d) }));
      // nome: viewBox 205 284 791 116 → papel x 200..880, topo na linha - 136; sub: 425 428 360 60
      const KN = 680 / 791, NX = 200, NY = YL - 136;
      const KS = 309.5 / 360, SX = 385.25, SY = YL + 38;

      // grão do grafite: o traço não é uma linha de computador
      const grao = (() => {
        const c = document.createElement("canvas"); c.width = c.height = 96;
        const x = c.getContext("2d"), r = mulberry32(99);
        const img = x.createImageData(96, 96);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = r(), a = v < 0.12 ? 0.35 : 0.72 + r() * 0.28;
          img.data[i] = 212; img.data[i + 1] = 208; img.data[i + 2] = 200; img.data[i + 3] = Math.round(255 * a);
        }
        x.putImageData(img, 0, 0);
        const pat = fc.createPattern(c, "repeat");
        pat.setTransform(new DOMMatrix().scale(0.42));
        return pat;
      })();
      function folhaImpressa(t) {
        // carimbo no topo da folha
        fc.save();
        fc.globalAlpha = 0.5; fc.strokeStyle = GRAFITE; fc.lineWidth = 0.8;
        fc.strokeRect(150, 150, 780, 44);
        fc.beginPath(); fc.moveTo(400, 150); fc.lineTo(400, 194); fc.moveTo(760, 150); fc.lineTo(760, 194); fc.stroke();
        fc.fillStyle = GRAFITE; fc.font = '400 15px "Montserrat"'; fc.letterSpacing = "3px"; fc.textAlign = "left";
        fc.globalAlpha = 0.75; fc.fillText("VELLARO DESIGN", 166, 178);
        fc.globalAlpha = 0.55; fc.font = '400 12px "Montserrat"'; fc.letterSpacing = "2px";
        fc.fillText("PROJETO DE MARCENARIA · PLANTA BAIXA", 416, 177);
        fc.fillText("ESC. 1:50 · FL 01", 776, 177);
        // norte e escala gráfica (2 m)
        fc.globalAlpha = 0.6; fc.lineWidth = 1;
        fc.beginPath(); fc.arc(190, 1186, 17, 0, Math.PI * 2); fc.stroke();
        fc.beginPath(); fc.moveTo(190, 1166); fc.lineTo(198, 1194); fc.lineTo(190, 1188); fc.lineTo(182, 1194); fc.closePath(); fc.fill();
        fc.font = '400 11px "Montserrat"'; fc.letterSpacing = "0px"; fc.textAlign = "center"; fc.fillText("N", 190, 1160);
        for (let i = 0; i < 4; i++) {
          const x0 = 250 + i * 61;
          i % 2 ? fc.strokeRect(x0, 1180, 61, 7) : fc.fillRect(x0, 1180, 61, 7);
        }
        fc.fillText("0", 250, 1206); fc.fillText("1", 372, 1206); fc.fillText("2 m", 494, 1206);
        fc.restore();

        const esc = clamp01((t - 12.35) / 0.9);

          fc.beginPath(); fc.rect(560, 790, 330 * esc, 120); fc.clip();
          fc.globalAlpha = 0.8; fc.fillStyle = grao; fc.textAlign = "center";
          fc.font = '400 22px "Montserrat"'; fc.letterSpacing = "5px"; fc.fillText("ESTAR · COZINHA", 725, 850);
          fc.globalAlpha = 0.6; fc.font = '400 17px "Montserrat"'; fc.letterSpacing = "2px"; fc.fillText("A = 42,88 m²", 725, 880);

        }
      }

      function base(ctx, esc) { ctx.setTransform(S * esc, 0, 0, S * esc, -X0 * S * esc, -Y0 * S * esc); }
      function trecho(ctx, s, k) {
        let orc = s.len * k;
        ctx.beginPath();
        for (const g of s.segs) {
          if (orc <= 0) break;
          const l = segLen(g), f = Math.min(1, orc / l);
          ctx.moveTo(g[0], g[1]);
          ctx.lineTo(lerp(g[0], g[2], f), lerp(g[1], g[3], f));
          orc -= l;
        }
        ctx.stroke();
      }

      function pintaFolha(t) {
        // papel
        fc.setTransform(1, 0, 0, 1, 0, 0);

        lc.lineCap = "round";

        // grade técnica, muito leve
        fc.globalAlpha = 0.05; fc.strokeStyle = GRAFITE; fc.lineWidth = 0.8;
        fc.beginPath();
        for (let x = -48; x <= 1140; x += 24) { fc.moveTo(x, 1240); fc.lineTo(x, 140); }
        for (let y = 144; y <= 1240; y += 24) { fc.moveTo(-60, y); fc.lineTo(1140, y); }
        fc.stroke();
        folhaImpressa(t);

        // traços e seus estados
        for (const s of todos) s.k = traco(clamp01((t - s.ini) / s.dur));
        // hachuras
        for (const h of hachuras) h.a = 0;
        for (const s of todos) if (s.depois) for (const h of s.depois) h.a = 0.35 * clamp01((t - s.ini - s.dur) / 0.4);
        fc.strokeStyle = GRAFITE; fc.lineWidth = 1;
        for (const h of hachuras) {
          if (h.a <= 0) continue;
          const [x, y, w, hh] = h.r;
          fc.save(); fc.globalAlpha = h.a; fc.beginPath(); fc.rect(x, y, w, hh); fc.clip();
          fc.beginPath();
          for (let d = -hh; d < w + hh; d += 9.9) { fc.moveTo(x + d, y); fc.lineTo(x + d - hh - 2, y + hh + 2); }
          fc.stroke(); fc.restore();
        }
        // fundos dos móveis
        fundos.forEach((f, i) => {
          const c = contornos[i];
          const a = 0.07 * clamp01((t - c.ini - c.dur) / 0.5);
          if (a <= 0) return;
          fc.globalAlpha = a; fc.fillStyle = GRAFITE; fc.fillRect(...f.r);
        });
        // linhas
        for (const s of todos) {
          if (s.k <= 0) continue;
          fc.globalAlpha = s.op; fc.strokeStyle = s.cor === GRAFITE ? grao : s.cor; fc.lineWidth = s.w;
          trecho(fc, s, s.k);
          if (s.led) {
            lc.globalAlpha = 1; lc.strokeStyle = LATAO; lc.lineWidth = s.w; trecho(lc, s, s.k);
            const halo = 0.55 * clamp01((t - s.ini - s.dur) / 0.5);
            if (halo > 0) {
              lc.save(); lc.globalAlpha = halo; lc.filter = "blur(5px)"; lc.lineWidth = 12; trecho(lc, s, 1); lc.restore();
              fc.save(); fc.globalAlpha = halo * 0.35; fc.filter = "blur(6px)"; fc.strokeStyle = LATAO; fc.lineWidth = 14; trecho(fc, s, 1); fc.restore();
            }
          }
          if (s.cota) {
            const c = s.cota;
            fc.globalAlpha = 0.75 * clamp01((t - s.ini + 0.1) / 0.2);
            fc.strokeStyle = GRAFITE;
            for (const e of c.extras) { fc.lineWidth = e[4] || 1; fc.beginPath(); fc.moveTo(e[0], e[1]); fc.lineTo(e[2], e[3]); fc.stroke(); }
            const prog = clamp01((t - s.ini) / (s.dur + 0.35));
            fc.globalAlpha = clamp01((t - s.ini) / 0.15);

            fc.fillStyle = GRAFITE; fc.font = '400 26px "Montserrat"'; fc.textAlign = "center"; fc.letterSpacing = "0.5px";
            fc.fillText((c.valor * out3(prog)).toFixed(2).replace(".", ","), 0, 0);
            fc.restore();
          }
        }
        // a linha se abre até a largura do logo
        const ab = 1 - Math.pow(1 - clamp01((t - ABRE) / ABRE_DUR), 4);
        if (ab > 0) {
          const ha = 0.55 * clamp01((t - ABRE - ABRE_DUR * 0.6) / 0.5);
          for (const [a, b] of [[300, 200], [780, 880]]) {
            const x = lerp(a, b, ab);
            fc.globalAlpha = 1; fc.strokeStyle = LATAO; fc.lineWidth = 3;
            fc.beginPath(); fc.moveTo(a, YL); fc.lineTo(x, YL); fc.stroke();
            lc.globalAlpha = 1; lc.strokeStyle = LATAO; lc.lineWidth = 3;
            lc.beginPath(); lc.moveTo(a, YL); lc.lineTo(x, YL); lc.stroke();
            if (ha > 0) { lc.save(); lc.globalAlpha = ha; lc.filter = "blur(5px)"; lc.lineWidth = 12; lc.beginPath(); lc.moveTo(a, YL); lc.lineTo(b, YL); lc.stroke(); lc.restore(); }
          }
        }
        // um brilho percorre a linha de latão quando o logo se completa

        // as marcas da régua usam a fonte: refaz a textura depois de carregada
        const relogio = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(relogio, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(relogio.t) }, 0);
        render(0);
        window.__timelines["mesa"] = tl;
      });
    })();
  </script>
</template>
